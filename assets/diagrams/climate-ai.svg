<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
<title id="title">Machine learning approaches to climate research</title><desc id="desc">Two research approaches: explainable LSTM for monsoon and cyclogenesis, and Bayesian CNN for probabilistic ENSO prediction. SHAP, ensembles and diagnostics support the analysis.</desc>
