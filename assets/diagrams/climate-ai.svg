<rect x="315" y="358" width="220" height="115" rx="16" fill="#d6e7f0"/><text class="label" text-anchor="middle" x="425" y="409">Bayesian CNN</text><text class="small" text-anchor="middle" x="425" y="444">Probabilistic methods</text>
