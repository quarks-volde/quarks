<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
<title id="title">Connecting climate model components</title><desc id="desc">A conceptual component diagram linking atmosphere, ocean and sea ice through coupling and interface validation.</desc>
<defs>
 <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#147e95"/><stop offset="1" stop-color="#063950"/></linearGradient>
 <linearGradient id="ice" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#a9dce9"/></linearGradient>
 <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#168c95"/></marker>
 <marker id="gold-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#efba65"/></marker>
 <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse"><path d="M45 0H0V45" fill="none" stroke="#a4cfda" stroke-opacity=".11"/></pattern>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#143446}.title{font-size:33px;font-weight:600}.label{font-size:29px;font-weight:600}.small{font-size:22px;fill:#506c77}.micro{font-size:18px;letter-spacing:2px;fill:#506c77}.line{fill:none;stroke:#168c95;stroke-width:4;marker-end:url(#arrow)}.node{fill:#fff;stroke:#c6dde3;stroke-width:2}</style>
<rect width="900" height="600" rx="24" fill="#edf5f7"/>
<text class="title" x="40" y="56">Connecting the components</text>
<rect class="node" x="298" y="96" width="304" height="103" rx="16"/><text class="label" text-anchor="middle" x="450" y="141">Atmosphere</text><text class="small" text-anchor="middle" x="450" y="176">Circulation &amp; surface forcing</text>
<rect x="287" y="278" width="326" height="116" rx="58" fill="#0c5766"/><text x="450" y="328" text-anchor="middle" fill="#fff" style="fill:white;font-size:29px;font-weight:600">Coupling &amp; interfaces</text><text x="450" y="366" text-anchor="middle" style="fill:#d2eeef;font-size:23px">Exchange · Test · Validate</text>
<rect class="node" x="50" y="463" width="315" height="102" rx="16"/><text class="label" text-anchor="middle" x="207" y="507">Ocean</text><text class="small" text-anchor="middle" x="207" y="542">Heat &amp; circulation</text>
<rect class="node" x="535" y="463" width="315" height="102" rx="16"/><text class="label" text-anchor="middle" x="692" y="507">Sea ice</text><text class="small" text-anchor="middle" x="692" y="542">Growth, melt &amp; motion</text>
<path class="line" d="M450 211V265" marker-start="url(#arrow)"/>
<path class="line" d="M330 389L234 450" marker-start="url(#arrow)"/>
<path class="line" d="M570 389L666 450" marker-start="url(#arrow)"/>
</svg>